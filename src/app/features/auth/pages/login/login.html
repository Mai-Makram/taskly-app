<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Welcome Back</mat-card-title>
    <mat-card-subtitle>Please enter your details to access your workspace</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="signup-form">
      <!-- Email -->
      <app-input
        label="EMAIL"
        type="email"
        placeholder="yourname@company.com"
        [control]="f.email"
        [errorMessage]="
          f.email.errors?.['required']
            ? 'Email is required'
            : f.email.errors?.['email']
              ? 'Please enter a valid email address'
              : ''
        "
      >
      </app-input>

      <!-- Password -->
      <app-input
        label="PASSWORD"
        type="password"
        placeholder="Password"
        [control]="f.password"
        [errorMessage]="f.password.errors?.['required'] ? 'Password is required' : ''"
      >
      </app-input>

      <div class="section-check">
        <mat-checkbox formControlName="rememberMe">Remember Me</mat-checkbox>
        <p>Forgot Password?</p>
      </div>

      <!-- Submit Button -->
      <div class="signup-form__action">
        <app-button variant="primary" typeBtn="submit" [disabled]="loginForm.invalid">
          Log In
        </app-button>
      </div>
    </form>
  </mat-card-content>
  <div class="footer-card">Don't have an account? <span routerLink="/signup">Sign Up</span></div>
</mat-card>
